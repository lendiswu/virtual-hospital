<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虛擬醫院 Virtual Hospital — 原型 v3</title>
<style>
  :root{
    --bg:#0E1726; --panel:#121D31; --card:#16233C; --card2:#1C2B49; --line:#28395C;
    --txt:#E8EDF5; --sub:#9FB0C9; --faint:#6B7C99;
    --teal:#2EC4B6; --gold:#E9B44C; --green:#8FBF6F; --purple:#A99BE8; --blue:#4EA3F2; --red:#E86A6A;
    --tmured:#A62E37;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:"PingFang TC","Microsoft JhengHei",sans-serif; min-height:100vh;}
  a{color:var(--teal); text-decoration:none;}
  button{font-family:inherit;}
  .proto{position:fixed; bottom:0; left:0; right:0; background:#0A1120; border-top:1px solid var(--line); color:var(--faint); font-size:11px; padding:5px 14px; z-index:99; letter-spacing:.5px;}

  /* ===== Landing ===== */
  .landing{max-width:1080px; margin:0 auto; padding:60px 24px 90px;}
  .l-top{display:flex; justify-content:space-between; align-items:center;}
  .logo{font-size:18px; font-weight:700; letter-spacing:3px;}
  .logo b{color:var(--teal);}
  .btn{display:inline-block; background:var(--teal); color:#08221F; border:none; border-radius:8px; padding:10px 26px; font-size:14.5px; font-weight:700; cursor:pointer; letter-spacing:1px;}
  .btn.ghost{background:transparent; color:var(--sub); border:1px solid var(--line); font-weight:400;}
  .btn.sm{padding:7px 16px; font-size:12.5px;}
  .btn:hover{filter:brightness(1.1);}
  .hero{margin-top:90px;}
  .hero h1{font-size:42px; letter-spacing:4px; line-height:1.35;}
  .hero h1 span{color:var(--teal);}
  .hero p{margin-top:18px; color:var(--sub); font-size:16px; line-height:1.9; max-width:640px;}
  .hero .btn{margin-top:32px;}
  .feat{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:80px;}
  @media(max-width:800px){.feat{grid-template-columns:1fr;}}
  .feat .f{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px;}
  .feat .f h3{font-size:15px; letter-spacing:1px; margin-bottom:8px;}
  .feat .f p{font-size:13px; color:var(--sub); line-height:1.7;}
  .feat .f .ic{font-size:22px; margin-bottom:10px;}
  .ann{margin-top:60px; border:1px solid var(--line); border-radius:12px; padding:18px 22px; background:var(--panel);}
  .ann h4{font-size:13px; color:var(--faint); letter-spacing:2px; margin-bottom:10px;}
  .ann li{list-style:none; font-size:13.5px; color:var(--sub); padding:6px 0; border-bottom:1px dashed var(--line);}
  .ann li:last-child{border-bottom:none;}
  .ann li time{color:var(--faint); font-size:12px; margin-right:12px;}

  /* ===== Login ===== */
  .login-wrap{display:flex; min-height:100vh;}
  .login-visual{flex:1.1; background:var(--tmured); display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:40px;}
  .login-visual .crest{width:min(430px,82%); display:block; position:relative; z-index:2;}
  .login-visual .vh-line{margin-top:30px; color:#FFF; text-align:center; letter-spacing:8px; font-size:25px; font-weight:700; position:relative; z-index:2;}
  .login-visual .vh-en{color:rgba(255,255,255,.85); text-align:center; letter-spacing:4px; font-size:12px; margin-top:9px; position:relative; z-index:2;}
  .login-visual .sky{position:absolute; bottom:-2px; left:0; width:72%; max-width:580px; z-index:1;}
  .login-form{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-box{width:380px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:36px 34px;}
  .login-box h2{font-size:20px; letter-spacing:2px; text-align:center;}
  .login-box .s{text-align:center; color:var(--faint); font-size:12px; margin-top:6px; letter-spacing:1px;}
  .fld{margin-top:18px;}
  .fld label{font-size:12px; color:var(--sub); letter-spacing:1px;}
  .fld input{width:100%; margin-top:6px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--txt); font-size:14px;}
  .login-box .btn{width:100%; margin-top:26px;}
  .demo{margin-top:24px; border-top:1px dashed var(--line); padding-top:16px;}
  .demo p{font-size:11.5px; color:var(--faint); letter-spacing:1px; margin-bottom:10px;}
  .demo .d-row{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .demo button{background:var(--card); border:1px solid var(--line); color:var(--sub); border-radius:8px; padding:9px 6px; font-size:12.5px; cursor:pointer; letter-spacing:1px;}
  .demo button:hover{color:var(--txt); border-color:var(--faint);}
  .demo button b{display:block; font-size:13px; margin-bottom:2px;}
  .demo button.l b{color:var(--teal);} .demo button.t b{color:var(--gold);}
  .demo button.m b{color:var(--green);} .demo button.a b{color:var(--purple);}
  @media(max-width:860px){
    .login-wrap{flex-direction:column;}
    .login-visual{flex:none; padding:34px 20px 70px;}
    .login-visual .crest{width:min(300px,70%);}
    .login-visual .vh-line{margin-top:18px; font-size:19px;}
    .login-visual .sky{width:55%;}
  }

  /* ===== Shell ===== */
  .shell{display:flex; min-height:100vh;}
  .side{width:224px; background:var(--panel); border-right:1px solid var(--line); padding:22px 14px; flex-shrink:0; display:flex; flex-direction:column;}
  .side .logo{font-size:15px; letter-spacing:2px; padding:0 8px 18px; border-bottom:1px solid var(--line);}
  .nav{margin-top:14px; flex:1;}
  .nav a{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; color:var(--sub); font-size:13.5px; letter-spacing:1px; margin-bottom:3px;}
  .nav a .ic{width:20px; text-align:center;}
  .nav a:hover{background:var(--card); color:var(--txt);}
  .nav a.on{background:var(--card2); color:var(--txt); font-weight:700;}
  .side .me{border-top:1px solid var(--line); padding:14px 8px 4px; font-size:12.5px; color:var(--sub); line-height:1.7;}
  .side .me b{color:var(--txt);}
  .side .me .out{display:block; margin-top:8px; font-size:11.5px; color:var(--faint); cursor:pointer;}
  .main{flex:1; padding:30px 34px 70px; max-width:1240px;}
  .crumb{font-size:12px; color:var(--faint); letter-spacing:1px; margin-bottom:6px;}
  .pg-t{font-size:22px; letter-spacing:2px; font-weight:700;}
  .pg-s{color:var(--sub); font-size:13px; margin-top:4px;}

  /* ===== 共用 ===== */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr;}}
  .cardx{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
  .cardx h3{font-size:14px; letter-spacing:1.5px; color:var(--sub); margin-bottom:14px; font-weight:700;}
  .tagx{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:9px; font-weight:600; letter-spacing:.5px;}
  .tagx.teal{background:rgba(46,196,182,.14); color:var(--teal); border:1px solid rgba(46,196,182,.4);}
  .tagx.gold{background:rgba(233,180,76,.13); color:var(--gold); border:1px solid rgba(233,180,76,.4);}
  .tagx.green{background:rgba(143,191,111,.13); color:var(--green); border:1px solid rgba(143,191,111,.4);}
  .tagx.purple{background:rgba(169,155,232,.13); color:var(--purple); border:1px solid rgba(169,155,232,.4);}
  .tagx.blue{background:rgba(78,163,242,.14); color:var(--blue); border:1px solid rgba(78,163,242,.4);}
  .tagx.gray{background:rgba(255,255,255,.05); color:var(--faint); border:1px solid var(--line);}
  .tagx.red{background:rgba(232,106,106,.12); color:var(--red); border:1px solid rgba(232,106,106,.4);}
  .mini-btn{background:var(--card2); border:1px solid var(--line); color:var(--sub); font-size:12px; border-radius:7px; padding:6px 14px; cursor:pointer;}
  .mini-btn:hover{color:var(--txt);}
  .mini-btn.on{border-color:var(--teal); color:var(--teal); background:rgba(46,196,182,.1);}
  .mini-btn.warn{border-color:var(--gold); color:var(--gold);}
  .mt{margin-top:16px;} .mt2{margin-top:26px;}
  .tbl{width:100%; border-collapse:collapse; margin-top:6px;}
  .tbl th{font-size:11.5px; color:var(--faint); text-align:left; letter-spacing:1.5px; padding:9px 10px; border-bottom:1px solid var(--line); font-weight:600;}
  .tbl td{font-size:13px; color:var(--sub); padding:11px 10px; border-bottom:1px dashed var(--line); vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl td b{color:var(--txt); font-weight:600;}
  .tbl tr.hl td{background:rgba(46,196,182,.07);}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px;}
  @media(max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:15px 18px;}
  .stat b{font-size:24px;}
  .stat span{display:block; font-size:12px; color:var(--faint); margin-top:3px; letter-spacing:1px;}
  .tabs{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
  .tabs button{background:var(--card); border:1px solid var(--line); color:var(--sub); font-size:12.5px; border-radius:16px; padding:6px 16px; cursor:pointer; letter-spacing:1px;}
  .tabs button.on{background:rgba(46,196,182,.15); border-color:var(--teal); color:var(--teal);}
  .warnbar{background:rgba(233,180,76,.09); border:1px solid rgba(233,180,76,.4); border-radius:9px; padding:10px 14px; font-size:12.5px; color:var(--gold); margin-top:12px; line-height:1.6;}
  .okbar{background:rgba(46,196,182,.08); border:1px solid rgba(46,196,182,.4); border-radius:9px; padding:10px 14px; font-size:12.5px; color:var(--teal); margin-top:12px; line-height:1.6;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-top:9px; font-size:12.5px; color:var(--sub);}
  .bar-row .lb{width:110px; flex-shrink:0;}
  .bar-row .tr{flex:1; height:9px; background:var(--card2); border-radius:5px; overflow:hidden;}
  .bar-row .tr i{display:block; height:100%; border-radius:5px;}
  .bar-row .pc{width:44px; text-align:right; color:var(--faint); font-size:11.5px;}
  .lamp{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px;}
  .lamp.g{background:var(--teal);} .lamp.y{background:var(--gold);} .lamp.o{background:var(--red);}

  /* ===== Dashboard ===== */
  .lv-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .lv-badge{width:74px; height:74px; border-radius:50%; border:3px solid var(--teal); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0;}
  .lv-badge b{font-size:22px; color:var(--teal);}
  .lv-badge span{font-size:10px; color:var(--faint); letter-spacing:1px;}
  .xp{flex:1; min-width:220px;}
  .xp .t{display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:7px;}
  .bar{height:10px; background:var(--card2); border-radius:6px; overflow:hidden;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--teal),#5BC8E8); border-radius:6px;}
  .nu{margin-top:16px; border-top:1px dashed var(--line); padding-top:13px;}
  .nu .nu-t{font-size:12px; color:var(--gold); letter-spacing:1.5px; font-weight:700; margin-bottom:2px;}
  .nu-chip{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:8px 12px; margin-top:7px; cursor:pointer;}
  .nu-chip:hover{border-color:var(--gold);}
  .nu-chip .lk{font-size:14px;}
  .nu-chip .nm{flex:1; font-size:13px;}
  .nu-chip .nm small{display:block; color:var(--faint); font-size:11px; margin-top:1px;}
  .nu-chip .xpv{color:var(--teal); font-size:12px; font-weight:700;}
  .radar-wrap{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .radar-leg{font-size:11.5px; color:var(--sub); line-height:2;}
  .radar-leg i{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--teal); margin-right:8px;}
  .cont-act{display:flex; align-items:center; gap:16px;}
  .cont-act .info{flex:1;}
  .cont-act h4{font-size:15.5px; letter-spacing:1px;}
  .cont-act .st{font-size:12px; color:var(--sub); margin-top:4px;}
  .steps{display:flex; gap:4px; margin-top:10px;}
  .steps i{flex:1; height:6px; border-radius:3px; background:var(--card2);}
  .steps i.done{background:var(--teal);}
  .steps i.now{background:var(--gold);}
  .rec-item{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px dashed var(--line);}
  .rec-item:last-child{border-bottom:none;}
  .rec-item .rr{flex:1;}
  .rec-item .rr h5{font-size:13.5px;}
  .rec-item .rr p{font-size:11.5px; color:var(--faint); margin-top:3px;}
  .noti li{list-style:none; font-size:12.5px; color:var(--sub); padding:8px 0; border-bottom:1px dashed var(--line); line-height:1.6;}
  .noti li:last-child{border-bottom:none;}
  .noti time{color:var(--faint); font-size:11px; display:block;}

  /* ===== Catalog / Detail ===== */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 6px;}
  .filters button{background:var(--card); border:1px solid var(--line); color:var(--sub); font-size:12.5px; border-radius:16px; padding:6px 15px; cursor:pointer; letter-spacing:1px;}
  .filters button.on{background:rgba(46,196,182,.15); border-color:var(--teal); color:var(--teal);}
  .acts{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px;}
  @media(max-width:1050px){.acts{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:700px){.acts{grid-template-columns:1fr;}}
  .act{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; cursor:pointer; position:relative; transition:border-color .15s;}
  .act:hover{border-color:var(--faint);}
  .act.lock{opacity:.55; cursor:default;}
  .act .top{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .act h4{font-size:15.5px; letter-spacing:1px; line-height:1.5;}
  .act .dx{font-size:12px; color:var(--faint); margin-top:4px;}
  .act .meta{display:flex; justify-content:space-between; margin-top:14px; font-size:12px; color:var(--sub);}
  .act .meta .xpv{color:var(--teal); font-weight:700;}
  .act .lockmsg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px; color:var(--sub); background:rgba(14,23,38,.55); border-radius:12px; letter-spacing:1px;}
  .diff i{color:#3A4C6E; font-style:normal;}
  .diff i.on{color:var(--gold);}
  .back{font-size:12.5px; color:var(--faint); cursor:pointer; margin-bottom:14px; display:inline-block;}
  .back:hover{color:var(--txt);}
  .d-head{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .obj li{list-style:none; font-size:13px; color:var(--sub); padding:5px 0 5px 16px; position:relative; line-height:1.6;}
  .obj li::before{content:""; position:absolute; left:0; top:12px; width:5px; height:5px; border-radius:50%; background:var(--teal);}
  .stage-axis{display:flex; flex-wrap:wrap; gap:0; align-items:center; margin-top:6px;}
  .stg{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 13px; font-size:12.5px; color:var(--sub); letter-spacing:.5px;}
  .stg.done{border-color:var(--teal); color:var(--teal);}
  .stg.now{border-color:var(--gold); color:var(--gold); font-weight:700;}
  .stg.click{cursor:pointer;}
  .stg-ar{color:var(--faint); padding:0 7px; font-size:13px;}
  .fb{border-left:3px solid var(--blue); background:rgba(78,163,242,.06); border-radius:0 9px 9px 0; padding:12px 15px; margin-top:12px;}
  .fb.tch{border-left-color:var(--gold); background:rgba(233,180,76,.06);}
  .fb.mtr{border-left-color:var(--green); background:rgba(143,191,111,.06);}
  .fb .who{font-size:11.5px; color:var(--faint); margin-bottom:5px; letter-spacing:1px;}
  .fb p{font-size:13px; color:var(--sub); line-height:1.75;}
  .h-item{display:flex; gap:16px; padding:16px 0; border-bottom:1px dashed var(--line);}
  .h-item:last-child{border-bottom:none;}
  .h-item .dt{width:86px; flex-shrink:0; font-size:12px; color:var(--faint); padding-top:3px;}
  .h-item .bd{flex:1;}
  .h-item h4{font-size:14.5px; letter-spacing:1px;}
  .h-item .xg{font-size:12px; color:var(--teal); margin-top:3px;}

  /* ===== Runtime(虛擬臨床環境)===== */
  .run-grid{display:grid; grid-template-columns:1.25fr 1fr; gap:16px; margin-top:18px;}
  @media(max-width:1000px){.run-grid{grid-template-columns:1fr;}}
  .chatbox{display:flex; flex-direction:column; height:480px;}
  .chatlog{flex:1; overflow-y:auto; padding:6px 4px;}
  .msg{max-width:82%; margin-top:10px; padding:10px 13px; border-radius:11px; font-size:13px; line-height:1.7;}
  .msg.pt{background:var(--card2); border:1px solid var(--line); color:var(--sub); border-top-left-radius:3px;}
  .msg.me{background:rgba(46,196,182,.14); border:1px solid rgba(46,196,182,.35); color:var(--txt); margin-left:auto; border-top-right-radius:3px;}
  .msg .who{font-size:10.5px; color:var(--faint); margin-bottom:4px; letter-spacing:1px;}
  .chatin{display:flex; gap:8px; margin-top:10px;}
  .chatin input{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--txt); font-size:13px;}
  .coach{border:1px solid rgba(78,163,242,.45); background:rgba(78,163,242,.06); border-radius:11px; padding:13px 15px; margin-top:14px;}
  .coach .c-h{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--blue); letter-spacing:1px; font-weight:700;}
  .coach p{font-size:12.5px; color:var(--sub); line-height:1.7; margin-top:8px;}
  .ttabs{display:flex; gap:6px; flex-wrap:wrap;}
  .ttabs button{background:var(--card2); border:1px solid var(--line); color:var(--sub); font-size:12px; border-radius:8px; padding:7px 13px; cursor:pointer;}
  .ttabs button.on{border-color:var(--teal); color:var(--teal); background:rgba(46,196,182,.1);}
  .tpanel{margin-top:12px; background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:13px 15px; font-size:12.5px; color:var(--sub); line-height:1.8; min-height:150px;}
  .tpanel b{color:var(--txt);}
  .tpanel .abn{color:var(--red); font-weight:700;}
  .tpanel textarea{width:100%; height:90px; background:var(--card); border:1px solid var(--line); border-radius:8px; color:var(--txt); font-size:12.5px; padding:9px 11px; margin-top:8px; resize:vertical;}

  /* ===== 教案編輯器 ===== */
  .wiz{display:flex; align-items:center; gap:10px; margin-top:20px; font-size:12.5px; color:var(--faint); flex-wrap:wrap;}
  .wiz .w{display:flex; align-items:center; gap:8px;}
  .wiz .n{width:22px; height:22px; border-radius:50%; background:var(--card2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11.5px;}
  .wiz .w.on{color:var(--gold);}
  .wiz .w.on .n{border-color:var(--gold); color:var(--gold);}
  .case-item{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px dashed var(--line); font-size:13px; color:var(--sub);}
  .case-item:last-child{border-bottom:none;}
  .case-item b{color:var(--txt);}
  .case-item.sel{background:rgba(46,196,182,.06); border-radius:8px; padding-left:10px; padding-right:10px;}
  .toolgrid{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .toolchip{background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:8px 13px; font-size:12.5px; color:var(--sub); cursor:pointer; position:relative;}
  .toolchip.on{border-color:var(--teal); color:var(--teal); background:rgba(46,196,182,.1);}
  .toolchip .aitag{font-size:9.5px; color:var(--blue); margin-left:6px;}
  textarea.draft{width:100%; height:130px; background:var(--card2); border:1px solid var(--line); border-radius:9px; color:var(--sub); font-size:12.5px; padding:11px 13px; line-height:1.8; margin-top:10px; resize:vertical;}

  /* ===== 導師 ===== */

function diffStars(n){ let s=""; for(let i=1;i<=4;i++) s+=`<i class="${i<=n?'on':''}">★</i>`; return `<span class="diff">${s}</span>`; }
function modeTag(m){
  if(m.includes("課堂")) return `<span class="tagx gold">${m}</span>`;
  if(m.includes("多人")) return `<span class="tagx purple">${m}</span>`;
  return `<span class="tagx teal">${m}</span>`;
}
function radarSVG(comps, size=210){
  const c=size/2, r=size/2-34, n=comps.length;
  const pt=(i,v)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [c+Math.cos(a)*r*v, c+Math.sin(a)*r*v]; };
  let rings="";
  for(let k=1;k<=4;k++){
    const pts=comps.map((_,i)=>pt(i,k/4).join(",")).join(" ");
    rings+=`<polygon points="${pts}" fill="none" stroke="#28395C" stroke-width="1"/>`;
  }
  const axes=comps.map((_,i)=>{const[x,y]=pt(i,1);return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#28395C"/>`;}).join("");
  const poly=comps.map((d,i)=>pt(i,d.val/100).join(",")).join(" ");
  const labels=comps.map((d,i)=>{
    const[x,y]=pt(i,1.22);
    return `<text x="${x}" y="${y}" fill="#9FB0C9" font-size="10.5" text-anchor="middle" dominant-baseline="middle">${d.key}</text>`;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}${axes}
    <polygon points="${poly}" fill="rgba(46,196,182,.22)" stroke="#2EC4B6" stroke-width="2"/>${labels}</svg>`;
}
function lineSVG(vals, w=520, h=150){
  const max=Math.max(...vals), pad=24;
  const px=i=>pad+i*(w-2*pad)/(vals.length-1);
  const py=v=>h-pad-(v/max)*(h-2*pad);
  const pts=vals.map((v,i)=>px(i)+","+py(v)).join(" ");
  const dots=vals.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="3" fill="#2EC4B6"/>`).join("");
  const wk=vals.map((v,i)=>`<text x="${px(i)}" y="${h-6}" fill="#6B7C99" font-size="9.5" text-anchor="middle">W${i+1}</text>`).join("");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#28395C"/>
    <polyline points="${pts}" fill="none" stroke="#2EC4B6" stroke-width="2"/>${dots}${wk}</svg>`;
}
function barRow(lb,pc,color){
  return `<div class="bar-row"><span class="lb">${lb}</span><span class="tr"><i style="width:${pc}%;background:${color}"></i></span><span class="pc">${pc}%</span></div>`;
}
function shellFor(role, active, content){
  const nav = NAVS[role].map(n=>
    `<a href="#${n.h}" class="${active===n.h?'on':''}"><span class="ic">${n.ic}</span>${n.t}</a>`).join("");
  return `<div class="shell">
    <div class="side">
      <div class="logo">虛擬<b>醫院</b></div>
      <div class="nav">${nav}</div>
      <div class="me">${ROLE_ME[role]}<span class="out" onclick="logout()">← 登出</span></div>
    </div>
    <div class="main">${content}</div>
  </div>`;
}
function chatHtml(key, whoName, placeholder, sendFn){
  const msgs=S.chat[key]||[];
  return `<div class="chatbox">
    <div class="chatlog" id="clog">
      ${msgs.map(m=>`<div class="msg ${m.who==='me'?'me':'pt'}"><div class="who">${m.who==='me'?'你':whoName}</div>${m.text}</div>`).join("")}
    </div>
    <div class="chatin">
      <input id="chatIn" placeholder="${placeholder}" onkeydown="if(event.key==='Enter')${sendFn}">
      <button class="btn sm" onclick="${sendFn}">送出</button>
    </div>
  </div>`;
}

/* ===================== 學員:儀表板/目錄/詳情 ===================== */
function pageDash(){
  const u=DB.user;
  const prog=DB.records.find(r=>r.status==="in-progress");
  const act=prog?DB.activities.find(a=>a.id===prog.activityId):null;
  const curStage=S.runState[prog?prog.activityId:""]!==undefined?S.runState[prog.activityId]:(prog?prog.stageIdx:0);
  const stepsHtml=act?act.stages.map((s,i)=>{

function doReview(id, verdict){
  const ta=document.getElementById('rv-'+id);
  const note=ta?ta.value.trim():"";
  if(verdict==="退回"&&!note){ alert("退回必須附上審查意見,協助作者修正。"); return; }
  S.reviewDone[id]={r:verdict, note:note};
  if(id==="c05"){
    const c=DB.cases.find(x=>x.id==="c05");
    if(verdict==="通過"){ c.status="已通過"; c.ver="v1.0"; c.issue=null; }
    else { c.status="退回修正"; }
  }
  render();
}

function render(){
  const h=(location.hash||"#/").slice(1);
  if(!S.role && h!=="/" && h!=="/login"){ go("/login"); return; }
  const R={
    "/":pageLanding, "/login":pageLogin,
    "/learner/dash":pageDash, "/learner/catalog":pageCatalog, "/learner/history":pageHistory,
    "/learner/board":pageBoard, "/learner/social":pageSocial, "/learner/settings":pageSettings,
    "/teacher/dash":pageTDash, "/teacher/editor":pageTEditor, "/teacher/courses":pageTCourses,
    "/teacher/data":pageTData, "/teacher/library":pageTLibrary, "/teacher/review":pageTReview,
    "/mentor/overview":pageMOverview, "/mentor/mentee":pageMMentee,
    "/mentor/recommend":pageMRecommend, "/mentor/talk":pageMTalk,
    "/admin/accounts":pageAdminAccounts, "/admin/patients":pageAPatients,
    "/admin/avatar":pageAAvatar, "/admin/system":pageASystem
  };
  let out;
  if(R[h]) out=R[h]();
  else if(h.startsWith("/learner/act/")) out=pageDetail(h.split("/")[3]);
  else if(h.startsWith("/learner/run/")) out=pageRun(h.split("/")[3]);
  else out=pageLanding();
  app.innerHTML=out;

}
